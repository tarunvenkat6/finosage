<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinoSage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <a href="index.html" class="logo">
                        <i class="fas fa-chart-line"></i>
                        <span>FinoSage</span>
                    </a>
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue to your account</p>
                </div>

                <div class="social-auth">
                    <!-- Google Sign In Button -->
                    <div id="g_id_onload"
                         data-client_id="YOUR_GOOGLE_CLIENT_ID"
                         data-context="signin"
                         data-callback="handleGoogleSignIn">
                    </div>
                    <div class="g_id_signin" data-type="standard"></div>

                    <!-- X (Twitter) Sign In Button -->
                    <button class="social-btn twitter-btn" onclick="handleTwitterSignIn()">
                        <i class="fab fa-x-twitter"></i>
                        <span>Continue with X</span>
                    </button>
                </div>

                <div class="divider">
                    <span>or continue with email</span>
                </div>

                <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required
                                placeholder="Enter your email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required
                                placeholder="Enter your password">
                            <button type="button" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Include the API client -->
    <script src="assets/js/api-client.js"></script>
    <script>
        // Handle Google Sign In
        function handleGoogleSignIn(response) {
            // Get the ID token from the response
            const credential = response.credential;
            
            // Send the token to your backend
            fetch('http://localhost:5000/api/auth/google', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ credential })
            })
            .then(response => response.json())
            .then(data => {
                if (data.access_token) {
                    // Store the token and redirect
                    localStorage.setItem('authToken', data.access_token);
                    localStorage.setItem('refreshToken', data.refresh_token);
                    window.location.href = 'portfolio-dashboard.html';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Authentication failed', 'error');
            });
        }

        // Handle Twitter Sign In
        function handleTwitterSignIn() {
            // Open Twitter OAuth popup
            const width = 600;
            const height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            
            window.open(
                'http://localhost:5000/api/auth/twitter',
                'twitter-login',
                `width=${width},height=${height},left=${left},top=${top}`
            );
        }

        // Handle form submission
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            const submitBtn = event.target.querySelector('.submit-btn');
            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            submitBtn.disabled = true;

            try {
                // Use our API client to login
                const data = await apiClient.login(email, password);
                
                showNotification('Login successful', 'success');
                setTimeout(() => {
                    window.location.href = 'portfolio-dashboard.html';
                }, 1000);
            } catch (error) {
                showNotification(error.message, 'error');
            } finally {
                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
            }
        }

        // Toggle password visibility
        document.querySelector('.toggle-password').addEventListener('click', function() {
            const input = this.parentElement.querySelector('input');
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // Show notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }, 100);
        }

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const user = await apiClient.getCurrentUser();
                if (user) {
                    // User is already logged in, redirect to dashboard
                    window.location.href = 'portfolio-dashboard.html';
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
            }
        });
    </script>
</body>
</html>
