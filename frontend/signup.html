<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FinoSage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <a href="index.html" class="logo">
                        <i class="fas fa-chart-line"></i>
                        <span>FinoSage</span>
                    </a>
                    <h1>Create Account</h1>
                    <p>Join FinoSage to start your investment journey</p>
                </div>

                <div class="social-auth">
                    <!-- Google Sign In Button -->
                    <div id="g_id_onload"
                         data-client_id="YOUR_GOOGLE_CLIENT_ID"
                         data-context="signup"
                         data-callback="handleGoogleSignUp">
                    </div>
                    <div class="g_id_signin" data-type="standard"></div>

                    <!-- X (Twitter) Sign In Button -->
                    <button class="social-btn twitter-btn" onclick="handleTwitterSignUp()">
                        <i class="fab fa-x-twitter"></i>
                        <span>Continue with X</span>
                    </button>
                </div>

                <div class="divider">
                    <span>or sign up with email</span>
                </div>

                <form id="signupForm" class="auth-form" onsubmit="handleSignUp(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="firstName" name="firstName" required
                                    placeholder="Enter your first name">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="lastName" name="lastName" required
                                    placeholder="Enter your last name">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required
                                placeholder="Enter your email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required
                                placeholder="Create a password">
                            <button type="button" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-meter"></div>
                            <span class="strength-text">Password strength: Weak</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                placeholder="Confirm your password">
                            <button type="button" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Create Account</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle Google Sign Up
        function handleGoogleSignUp(response) {
            const credential = response.credential;
            
            fetch('/api/auth/google/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ credential })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    showNotification('Account created successfully', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Registration failed', 'error');
            });
        }

        // Handle Twitter Sign Up
        function handleTwitterSignUp() {
            const width = 600;
            const height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            
            window.open(
                '/api/auth/twitter/signup',
                'twitter-signup',
                `width=${width},height=${height},left=${left},top=${top}`
            );
        }

        // Handle form submission
        function handleSignUp(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            // Validate passwords match
            if (formData.get('password') !== formData.get('confirmPassword')) {
                showNotification('Passwords do not match', 'error');
                return;
            }

            // Show loading state
            const submitBtn = form.querySelector('.submit-btn');
            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            submitBtn.disabled = true;

            // Send signup request
            fetch('/api/auth/signup', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    showNotification('Account created successfully', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Registration failed');
                }
            })
            .catch(error => {
                showNotification(error.message, 'error');
                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
            });
        }

        // Password strength checker
        const passwordInput = document.getElementById('password');
        const strengthMeter = document.querySelector('.strength-meter');
        const strengthText = document.querySelector('.strength-text');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            // Calculate password strength
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]+/)) strength += 25;
            if (password.match(/[A-Z]+/)) strength += 25;
            if (password.match(/[0-9]+/)) strength += 25;
            
            // Update UI
            strengthMeter.style.width = strength + '%';
            strengthMeter.style.backgroundColor = getStrengthColor(strength);
            strengthText.textContent = `Password strength: ${getStrengthText(strength)}`;
        });

        function getStrengthColor(strength) {
            if (strength <= 25) return '#ff4444';
            if (strength <= 50) return '#ffbb33';
            if (strength <= 75) return '#00C851';
            return '#007E33';
        }

        function getStrengthText(strength) {
            if (strength <= 25) return 'Weak';
            if (strength <= 50) return 'Fair';
            if (strength <= 75) return 'Good';
            return 'Strong';
        }

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const type = input.type === 'password' ? 'text' : 'password';
                input.type = type;
                
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        });

        // Show notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }, 100);
        }
    </script>
</body>
</html>
